version: "3.8"

# Avvio: docker compose -f docker-compose.prod.yml up -d --build
# Richiede un file .env nella stessa cartella con DATABASE_URL e SECRET_KEY

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
