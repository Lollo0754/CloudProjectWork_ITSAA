version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cloudproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/cloudproject
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
